# =============================================================================
# dc_license - Cryptographic License Validation
# =============================================================================
# Offline license verification using Ed25519 digital signatures.
#
# Security Model:
# - Asymmetric cryptography: Public key embedded in app, private key kept secret
# - Hardware binding: License tied to specific machine (HWID)
# - Expiry support: Time-limited licenses
# - Feature flags: Control which features are enabled
# =============================================================================

[package]
name = "dc_license"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Cryptography
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time handling
chrono.workspace = true

# Hardware ID
# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Hardware ID
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
machine-uid.workspace = true

[dev-dependencies]
# Testing
tempfile = "3.14"
