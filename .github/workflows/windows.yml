name: Windows build and runtime verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Test workspace on Windows
        run: cargo test --workspace --locked
      - name: Build portable release
        shell: pwsh
        run: ./scripts/bundle-windows.ps1
      - name: Generate comparison session
        run: cargo run --locked -p dc_app --example showcase_session -- dist/windows/showcase.dcs
      - name: Verify version and GUI startup
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Executable ./dist/windows/DiffComp-Studio/diffcomp-studio.exe -Session ./dist/windows/showcase.dcs -OutputDirectory ./dist/windows/verification
      - name: Upload Windows release and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diffcomp-studio-windows
          path: |
            dist/windows/*.zip
            dist/windows/DiffComp-Studio/diffcomp-studio.exe
            dist/windows/verification/
          if-no-files-found: error
          retention-days: 30
